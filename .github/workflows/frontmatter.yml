name: frontmatter

# content/posts에 글이 들어오면 에이전트가 분류 필드를 채워 PR로 올린다.
# 사람은 diff를 보고 머지한다. 자동으로 main에 커밋하지 않는다 — 검토가 이 파이프라인의 절반이다.

on:
  push:
    branches-ignore:
      - "bot/frontmatter/**" # 자기 자신이 만든 브랜치로 다시 돌지 않게
    paths:
      - "content/posts/**.md"
  workflow_dispatch:
    inputs:
      all:
        description: "이미 채워진 필드도 다시 생성"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: frontmatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: frontmatter 생성
        run: npm run frontmatter ${{ inputs.all && '-- --all' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 변경 여부 확인
        id: diff
        run: |
          if git diff --quiet -- content/posts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "채울 필드가 없었습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- content/posts
          fi

      # 생성된 frontmatter도 사람이 쓴 것과 같은 관문을 통과해야 한다.
      # 스키마를 어겼다면 여기서 멈추고 PR을 만들지 않는다.
      - name: 검증
        if: steps.diff.outputs.changed == 'true'
        run: npm run verify

      - name: PR 열기
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="bot/frontmatter/${GITHUB_SHA::7}"

          git config user.name "frontmatter-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/posts
          git commit -m "chore: frontmatter 자동 생성

          ${GITHUB_SHA::7}의 본문을 읽고 description/categories/tags를 채웠습니다.
          lib/schema.ts의 frontmatterSchema를 통과한 결과입니다."
          git push origin "$branch"

          gh pr create \
            --base "$BASE_REF" \
            --head "$branch" \
            --title "chore: frontmatter 자동 생성 (${GITHUB_SHA::7})" \
            --body "본문에서 생성한 분류 필드입니다. 태그가 기존 어휘를 재사용했는지, 요약이 본문과 맞는지 확인하고 머지해 주세요.

          - 모델이 채운 필드: \`description\`, \`categories\`, \`tags\`
          - 사람이 소유하는 필드: \`title\`, \`date\`, \`author\`, \`draft\` (건드리지 않습니다)
          - 생성 결과는 \`npm run verify\`를 통과했습니다."
